  <!---
  
  HTML(HyperText Markup LAnguage (HTML))

  Linguagem de marcação de hipertexto

  - Marca o conteúdo e define a estrutura do site.

  serve para marcarmos os textos (título, parágrafo, lista), adicionarmos imagens, vídeos, links e mais. dá sentido (semãntica) ao conteúdo.

  .html

  arquivo de texto simples terminado em .html

  <p> Olá Mundo! </p>
  
  -------

  CSS

  Cascading Style sheets

  -Linguagem de estilo

  Define o estilo do documento

  cor do texto, tamanho do texto, tamanho da imagem, posição do conteúdo, cor de fundo, sombras e mais.

  .css

  arquivo de texro simples terminado em .css

  p{
  color: blue;
  }

  JavaScript
  Linguagem de script (Programação)

  Altera o comportamento do documento 

  Utilizado para modificar o estilo, criar galerias de imagens, observar as ações do usuário, puxar informações de outros sites, manipuplar dados e mais.

  .js

  Arquivo de texto simples terminado em .js

  function mudar() {
  texto.style.color = 'red';
  }
texto.addEventListener('click', mudar);
  
  -->
